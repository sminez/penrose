[package]
name = "penrose"
version = "0.4.0"
edition = "2024"
authors = ["sminez <innes.andersonmorrison@gmail.com>"]
license = "MIT"
repository = "https://github.com/sminez/penrose"
documentation = "https://docs.rs/penrose"
readme = "README.md"
description = "A tiling window manager library inspired by dwm and xmonad"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md"
]
keywords = [ "wm", "windowmanager", "window", "manager", "x11" ]

[workspace]
members = [
  "crates/penrose_ui",
  "crates/penrose_keysyms"
]

[features]
default = ["x11rb"]
# The x11rb backend, and everything under src/x/ that it implements.
x11rb = ["dep:x11rb"]
x11rb-xcb = ["x11rb", "x11rb/allow-unsafe-code"]
# The river backend (src/river/). Additive with x11rb: both may be enabled.
river = ["dep:wayland-client", "dep:wayland-scanner"]

[dependencies]
anymap = "0.12"
bitflags = { version = "2.9", features = ["serde"] }
nix = { version = "0.30", default-features = false, features = ["signal"] }
penrose_keysyms = { version = "0.3.6", path = "crates/penrose_keysyms" }
serde = { version = "1.0", features = ["derive"], optional = true }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2.0"
tracing = { version = "0.1", features = ["attributes"] }

# [target.'cfg(target_os = "macos")'.dependencies]

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
x11rb = { version = "0.13", features = ["randr"], optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-scanner = { version = "0.31", optional = true }

[dev-dependencies]
pretty_assertions = "1.4.1"
quickcheck = "1"
quickcheck_macros = "1"
serde_json = "1"
simple_test_case = "1"
simple_txtar = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dev-dependencies]
penrose_ui = { path = "crates/penrose_ui" }

# Every other example is X11 and is picked up by cargo's autodiscovery. This one needs naming so
# that it is only built when the river backend is.
[[example]]
name = "river_minimal"
path = "examples/river_minimal/main.rs"
required-features = ["river"]

[[example]]
name = "river_bindings"
path = "examples/river_bindings/main.rs"
required-features = ["river"]

[[example]]
name = "river_restart"
path = "examples/river_restart/main.rs"
required-features = ["river"]

[[example]]
name = "river_menu"
path = "examples/river_menu/main.rs"
required-features = ["river"]
